<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a3c5e">
<title>PO Viewer - Pioneer Cranes</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #1a3c5e; font-family: Arial, sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #eef2f6; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
         background: #1a3c5e; color: #fff; display: none; align-items: center; gap: 12px; z-index: 2; font-size: 14px; }
  .bar a { background: #f2b705; color: #1a1a1a; padding: 10px 14px; text-decoration: none; font-weight: bold; white-space: nowrap; }
</style>
</head>
<body>
<!-- ===== CHANGE ONLY THIS LINE: your PO Viewer web app URL (ends with /exec) ===== -->
<script>var APP_URL = 'https://script.google.com/macros/s/AKfycbxLhSEJSopqCbAOx3avFjL-iyVK901j4ANIxo-boiL_-X6t-Ott5cK-Dg8TzYPh5kLn/exec';</script>

<iframe id="app" allow="clipboard-write"></iframe>
<div class="bar" id="bar">
  <span>Not loading on this phone?</span>
  <a id="direct" href="#">Open directly</a>
</div>

<script>
  var frame = document.getElementById('app');
  var bar = document.getElementById('bar');
  document.getElementById('direct').href = APP_URL;

  // Try the app inside the frame; if it has not loaded in 8 seconds, show the backup button.
  var loaded = false;
  frame.onload = function () { loaded = true; };
  frame.src = APP_URL;
  setTimeout(function () { bar.style.display = 'flex'; }, loaded ? 15000 : 8000);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
